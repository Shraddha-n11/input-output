<div class="card mt-5">
<div class="card-body">
<ng-container *ngIf="todos.length > 0; else noTodos">
    <ul class="list-group">
        <li 
        *ngFor="let todo of todos"
        class="list-group-item d-flex justify-content-between align-items-center">
        <div>
            <input type="checkbox"
            class="mr-3"
            style="width: 20px; height: 20px;"
            [checked]="todo.isCompleted">
        <strong>{{todo.todoItem}}</strong>
        <span class="badge ml-2" [ngClass]="{'badge-success':todo.isCompleted, 'badge-danger': !todo.isCompleted}"
        >{{todo.isCompleted ? "Completed": "incomplete"}}</span>
        </div>
        <div>
            <button mat-mini-fab color="primary" class="mr-2">
                <mat-icon>edit</mat-icon></button>
            <button mat-mini-fab color="warn">
                <mat-icon>delete</mat-icon></button>
        </div>
        </li>

    </ul>

</ng-container>

<ng-template #noTodos>

<p class="alert alert-info">No Todos!!!</p>
    </ng-template>

    </div>
    </div>
