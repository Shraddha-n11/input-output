<div class="card mt-5">
    <div class="card-body">
<form #todoForm="ngForm" (ngSubmit)="onTodoAdd()">
    <div class="form-group mb-3">
        <label for="todoItem">ToDo Item</label>
        <input 
        name="todoItem"
        ngModel
        type="text" 
        class="form-control"
        required>
    </div>
    <div class="form-group mb-3">
        <label for="todoItem">is Completed</label>
        <select required
        name="isCompleted"
        ngModel
        type="text" 
        class="form-control">
        <option value="true">Yes</option>
        <option value="false">No</option>
        </select>
    </div>
    <button
    mat-raised-button color="primary"
    class="btn-block"
    >
        Add Todo
    </button>
</form>
</div>
</div>
